    margin-bottom:12px;
    font-weight:700;
    border:2px solid transparent;

  a.link-btn:hover{

  a.link-btn.primary{

    color:var(--navy-dark);

  a.link-btn .icon{

    height:24px;

    justify-content:center;

    height:24px;

  }
  a.link-btn .sub-label{

  }
  .section-label{

    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--green);
    margin:22px 0 8px 4px;
    font-weight:700;

  .footer{

    font-size:13px;

  .footer strong{
